<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vapor Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05060a;
    --bg-2: #0b0e17;
    --fg: #f4f3f8;
    --muted: #888ea3;
    --muted-2: #5b5f72;
    --violet: #9b8cff;
    --cyan: #63d9d1;
    --card-bg: rgba(255,255,255,0.045);
    --card-border: rgba(255,255,255,0.10);
    --card-border-hover: rgba(255,255,255,0.20);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Manrope', sans-serif;
    overflow-x: hidden;
  }

  #stars { position: fixed; inset: 0; z-index: 0; display: block; }

  .mist {
    position: fixed;
    inset: -20%;
    z-index: 1;
    pointer-events: none;
    filter: blur(60px);
    opacity: 0.55;
    mix-blend-mode: screen;
  }
  .mist span {
    position: absolute;
    border-radius: 50%;
    opacity: 0.35;
  }
  .mist span:nth-child(1) {
    width: 46vw; height: 46vw; left: 8%; top: 12%;
    background: radial-gradient(circle at 30% 30%, var(--violet), transparent 70%);
    animation: drift1 70s ease-in-out infinite alternate;
  }
  .mist span:nth-child(2) {
    width: 40vw; height: 40vw; right: 5%; top: 30%;
    background: radial-gradient(circle at 60% 40%, var(--cyan), transparent 70%);
    animation: drift2 85s ease-in-out infinite alternate;
  }
  .mist span:nth-child(3) {
    width: 32vw; height: 32vw; left: 35%; bottom: 5%;
    background: radial-gradient(circle at 50% 50%, #5c6bd9, transparent 70%);
    animation: drift3 95s ease-in-out infinite alternate;
  }
  @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(6vw, 8vh) scale(1.15); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-8vw, -6vh) scale(0.9); } }
  @keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(4vw, -10vh) scale(1.1); } }

  /* ---------- Landing ---------- */
  #landing {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    transition: opacity 0.85s cubic-bezier(.6,0,.2,1), transform 0.85s cubic-bezier(.6,0,.2,1);
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-size: clamp(3rem, 9vw, 6.5rem);
    letter-spacing: 0.01em;
    text-align: center;
    color: var(--fg);
    text-shadow: 0 0 40px rgba(155, 140, 255, 0.35), 0 0 90px rgba(99, 217, 209, 0.15);
    user-select: none;
  }
  .wordmark em {
    font-style: italic;
    background: linear-gradient(90deg, var(--violet), var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin-top: -28px;
  }

  .portal-btn {
    position: relative;
    width: min(480px, 82vw);
    padding: 20px 30px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--muted);
    font-family: 'Manrope', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .portal-btn::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 999px;
    padding: 1px;
    background: linear-gradient(120deg, var(--violet), transparent 40%, transparent 60%, var(--cyan));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .portal-btn:hover {
    color: var(--fg);
    background: rgba(255,255,255,0.07);
    box-shadow: 0 0 40px rgba(155,140,255,0.18), 0 0 70px rgba(99,217,209,0.10);
    transform: translateY(-2px);
  }
  .portal-btn:hover::before { opacity: 1; }
  .portal-btn .arrow { transition: transform 0.35s ease; opacity: 0.7; }
  .portal-btn:hover .arrow { transform: translateX(4px); opacity: 1; }

  body.app-active #landing {
    opacity: 0;
    transform: translateY(-50px) scale(0.94);
    pointer-events: none;
  }

  /* ---------- App shell ---------- */
  #app {
    position: relative;
    z-index: 5;
    max-width: 920px;
    margin: 0 auto;
    padding: 60px 24px 100px;
    opacity: 0;
    transform: translateY(36px);
    pointer-events: none;
    transition: opacity 0.9s cubic-bezier(.6,0,.2,1) 0.15s, transform 0.9s cubic-bezier(.6,0,.2,1) 0.15s;
  }
  body.app-active #app {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .app-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 44px;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 22px;
  }
  .app-header .mark {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 500;
  }
  .app-header .mark em {
    font-style: italic;
    background: linear-gradient(90deg, var(--violet), var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .app-header .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted-2);
  }

  h2.section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    margin: 0 0 16px 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 36px;
  }

  .sc-label {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.86rem;
    color: var(--muted);
    transition: all 0.2s ease;
    user-select: none;
  }
  .sc-label:hover {
    border-color: var(--card-border-hover);
    color: var(--fg);
  }
  .sc-label:has(.sc:checked) {
    background: linear-gradient(135deg, rgba(155,140,255,0.14), rgba(99,217,209,0.10));
    border-color: rgba(155,140,255,0.45);
    color: var(--fg);
    box-shadow: 0 0 24px rgba(155,140,255,0.12);
  }
  input[type="checkbox"].sc {
    appearance: none;
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    min-width: 15px;
    border-radius: 4px;
    border: 1px solid var(--card-border-hover);
    background: transparent;
    display: grid;
    place-content: center;
    cursor: pointer;
    margin: 0;
  }
  input[type="checkbox"].sc:checked {
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    border-color: transparent;
  }
  input[type="checkbox"].sc:checked::after {
    content: "";
    width: 5px; height: 8px;
    border: solid #05060a;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 28px;
    margin-bottom: 40px;
    padding-top: 28px;
    border-top: 1px solid var(--card-border);
  }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted-2);
  }
  .field input[type="number"] {
    width: 90px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--fg);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
  }
  .field input[type="number"]:focus {
    outline: none;
    border-color: rgba(155,140,255,0.5);
  }

  button.solve-btn {
    background: linear-gradient(120deg, var(--violet), var(--cyan));
    color: #05060a;
    border: none;
    padding: 13px 28px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.01em;
    transition: all 0.25s ease;
    margin-left: auto;
  }
  button.solve-btn:hover {
    box-shadow: 0 0 30px rgba(155,140,255,0.35), 0 0 60px rgba(99,217,209,0.2);
    transform: translateY(-1px);
  }
  button.solve-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  #results { margin-top: 12px; }
  #results:empty::before {
    content: "Your formulas will appear here.";
    color: var(--muted-2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 18px 20px;
    border-radius: 12px;
    margin-bottom: 12px;
    transition: border-color 0.25s ease;
  }
  .card:hover { border-color: var(--card-border-hover); }
  .card b { color: var(--cyan); font-family: 'JetBrains Mono', monospace; }
  .card div { font-size: 0.9rem; padding: 2px 0; }
  .meta {
    color: var(--muted-2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--card-border);
  }

  @media (prefers-reduced-motion: reduce) {
    .mist span, #landing, #app { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="mist"><span></span><span></span><span></span></div>

<div id="landing">
  <div class="wordmark">Vapor <em>Solver</em></div>
  <div class="tagline">Exact-match antiviral formulas</div>
  <button class="portal-btn" id="enterBtn">Get to Solving <span class="arrow">&#8594;</span></button>
</div>

<div id="app">
  <div class="app-header">
    <div class="mark">Vapor <em>Solver</em></div>
    <div class="sub">Formula Engine</div>
  </div>

  <h2 class="section-label">Target Symptoms</h2>
  <div class="grid" id="checkboxGroup"></div>

  <div class="controls">
    <div class="field">
      <label for="maxIng">Max Ingredients</label>
      <input type="number" id="maxIng" value="60">
    </div>
    <div class="field">
      <label for="limit">Recipes to Find</label>
      <input type="number" id="limit" value="5">
    </div>
    <button class="solve-btn" onclick="solve()">Generate Formulas</button>
  </div>

  <div id="results"></div>
</div>

<script>
  // ---------- Starfield ----------
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width * canvas.height) / 3800);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.015 + 0.005,
      base: Math.random() * 0.4 + 0.25
    }));
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let t = 0;
  function drawStars() {
    t += 1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      const twinkle = s.base + Math.sin(t * s.speed + s.phase) * 0.35;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(244,243,248,${Math.max(0, twinkle)})`;
      ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();

  // ---------- Landing -> App transition ----------
  document.getElementById('enterBtn').addEventListener('click', () => {
    document.body.classList.add('app-active');
    setTimeout(() => {
      document.getElementById('landing').style.display = 'none';
    }, 900);
  });

  // ---------- Solver (unchanged logic) ----------
  const ingredientTable = {
      "Dermatrix": {"Eye Irritation": 5, "Skin Rash": 10, "Sneezing": -5},
      "Neurovex": {"Fainting": -5, "Migraine": -5, "Hallucinations": 15},
      "Morvexis": {"Sneezing": -5, "Cough": 15},
      "Oculyte": {"Eye Irritation": 10, "Skin Rash": -5},
      "Lumicet": {"Migraine": -5, "Eye Irritation": 15},
      "Bronchex": {"Cough": 10, "Sore Throat": -5},
      "Myocordin": {"Fatigue": -5, "Paralysis": 5, "Muscle Pain": 10},
      "Hallucor": {"Fainting": -5, "Hallucinations": 15},
      "Virexon": {"Nausea": 15, "Vomiting": -5},
      "Organex": {"Coma": -5, "Organ Failure": 15},
      "Velmorin": {"Fatigue": 10, "Fever": -5},
      "Trivexol": {"Chills": -5, "Fatigue": 5, "Fever": 10},
      "Neurozil": {"Migraine": 15, "Eye Irritation": -5},
      "Cryostin": {"Chills": -5, "Fever": 10},
      "Throxil": {"Cough": -5, "Sore Throat": 15},
      "Dermavax": {"Eye Irritation": -5, "Skin Rash": 15},
      "Synaptix": {"Fainting": 15, "Hallucinations": -5},
      "Clairion": {"Blindness": -5, "Migraine": 10},
      "Xenoviralyn": {"Chills": 15, "Fever": -5},
      "Luxbane": {"Blindness": 15, "Migraine": -5},
      "Stabilon": {"Fainting": 10, "Vertigo": -5},
      "Zypheral": {"Sneezing": 15, "Cough": -5},
      "Paralynth": {"Paralysis": 15, "Muscle Pain": -5},
      "Vertigen": {"Fainting": -5, "Vertigo": 15},
      "Organilax": {"Paralysis": -5, "Coma": 5, "Organ Failure": 10},
      "Emetrolix": {"Nausea": -5, "Vomiting": 15},
      "Pulmovar": {"Sneezing": -5, "Cough": 10, "Sore Throat": 5},
      "Somnora": {"Coma": 15, "Organ Failure": -5},
      "Talorinex": {"Fatigue": -5, "Fever": 15},
      "Myonex": {"Paralysis": -5, "Muscle Pain": 15}
  };

  const allSymptoms = Object.keys(Object.values(ingredientTable).reduce((acc, curr) => ({...acc, ...curr}), {}));

  const container = document.getElementById('checkboxGroup');
  allSymptoms.sort().forEach(s => {
      container.innerHTML += `<label class="sc-label"><input type="checkbox" class="sc" value="${s}">${s}</label>`;
  });

  function gcdBig(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { [a, b] = [b, a % b]; } return a === 0n ? 1n : a; }
  class Frac {
      constructor(n, d = 1n) {
          if (typeof n === "number") n = BigInt(n);
          if (typeof d === "number") d = BigInt(d);
          if (d < 0n) { n = -n; d = -d; }
          const g = gcdBig(n < 0n ? -n : n, d);
          this.n = g === 0n ? n : n / g;
          this.d = g === 0n ? d : d / g;
      }
      add(o) { return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); }
      sub(o) { return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); }
      mul(o) { return new Frac(this.n * o.n, this.d * o.d); }
      div(o) { return new Frac(this.n * o.d, this.d * o.n); }
      isZero() { return this.n === 0n; }
      isInteger() { return this.d === 1n; }
  }

  function rref(matrix) {
      const rows = matrix.length, cols = matrix[0].length;
      let lead = 0;
      const pivotCols = [];
      for (let r = 0; r < rows && lead < cols - 1; r++) {
          let i = r;
          while (i < rows && matrix[i][lead].isZero()) i++;
          if (i === rows) { lead++; r--; continue; }
          [matrix[r], matrix[i]] = [matrix[i], matrix[r]];
          const pivotVal = matrix[r][lead];
          for (let j = 0; j < cols; j++) matrix[r][j] = matrix[r][j].div(pivotVal);
          for (let i2 = 0; i2 < rows; i2++) {
              if (i2 === r) continue;
              const factor = matrix[i2][lead];
              if (factor.isZero()) continue;
              for (let j = 0; j < cols; j++) matrix[i2][j] = matrix[i2][j].sub(factor.mul(matrix[r][j]));
          }
          pivotCols.push(lead);
          lead++;
      }
      return { matrix, pivotCols };
  }

  function getComponents(selected) {
      const ingredientNames = Object.keys(ingredientTable);
      const n = selected.length;
      const parent = Array.from({ length: n }, (_, i) => i);
      function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
      function union(a, b) { a = find(a); b = find(b); if (a !== b) parent[a] = b; }

      for (const name of ingredientNames) {
          const touched = [];
          for (let s = 0; s < n; s++) {
              if ((ingredientTable[name][selected[s]] || 0) !== 0) touched.push(s);
          }
          for (let k = 1; k < touched.length; k++) union(touched[0], touched[k]);
      }
      const groups = new Map();
      for (let s = 0; s < n; s++) {
          const r = find(s);
          if (!groups.has(r)) groups.set(r, []);
          groups.get(r).push(selected[s]);
      }
      return [...groups.values()];
  }

  async function solveCluster(selected, maxIng, wanted, onProgress) {
      const relevantNames = Object.keys(ingredientTable).filter(name =>
          selected.some(s => (ingredientTable[name][s] || 0) !== 0)
      );
      const effects = relevantNames.map(name => selected.map(s => ingredientTable[name][s] || 0));
      const k = selected.length, m = relevantNames.length;

      const aug = [];
      for (let s = 0; s < k; s++) {
          const row = [];
          for (let i = 0; i < m; i++) row.push(new Frac(effects[i][s]));
          row.push(new Frac(100));
          aug.push(row);
      }
      const { matrix, pivotCols } = rref(aug);
      const pivotSet = new Set(pivotCols);
      const freeCols = [];
      for (let c = 0; c < m; c++) if (!pivotSet.has(c)) freeCols.push(c);

      for (let r = pivotCols.length; r < matrix.length; r++) {
          const row = matrix[r];
          const allZeroLHS = row.slice(0, m).every(f => f.isZero());
          if (allZeroLHS && !row[m].isZero()) return { solutions: [], infeasible: true };
      }

      const pivotRows = pivotCols.map((pc, idx) => ({ col: pc, row: idx }));

      function evaluate(freeVals) {
          const x = new Array(m).fill(null);
          freeCols.forEach((fc, idx) => { x[fc] = freeVals[idx]; });
          for (const { col, row } of pivotRows) {
              let val = matrix[row][m];
              for (let idx = 0; idx < freeCols.length; idx++) {
                  val = val.sub(matrix[row][freeCols[idx]].mul(new Frac(freeVals[idx])));
              }
              if (!val.isInteger()) return null;
              if (val.n < 0n) return null;
              x[col] = Number(val.n);
          }
          return x;
      }

      const nFree = freeCols.length;
      const solutions = [];
      const seenCombos = new Set();

      function tryRecord(x) {
          if (!x) return;
          if (x.reduce((a, b) => a + b, 0) > maxIng) return;
          const combo = [];
          relevantNames.forEach((name, i) => { for (let c = 0; c < x[i]; c++) combo.push(name); });
          const key = JSON.stringify(combo.slice().sort());
          if (!seenCombos.has(key)) { seenCombos.add(key); solutions.push(combo); }
      }

      if (nFree === 0) {
          tryRecord(evaluate([]));
          return { solutions, infeasible: solutions.length === 0 };
      }

      const maxPerVar = Math.max(5, Math.min(50, maxIng));
      const CHUNK = 20000;

      if (Math.pow(maxPerVar + 1, nFree) <= 4000000) {
          const counters = new Array(nFree).fill(0);
          let tried = 0;
          outer:
          while (true) {
              tryRecord(evaluate(counters));
              tried++;
              if (solutions.length >= wanted) break;
              if (tried % CHUNK === 0) {
                  if (onProgress) onProgress(tried, Math.pow(maxPerVar + 1, nFree));
                  await new Promise(resolve => setTimeout(resolve, 0));
              }
              let idx = 0;
              while (idx < nFree) {
                  counters[idx]++;
                  if (counters[idx] > maxPerVar) { counters[idx] = 0; idx++; }
                  else break;
              }
              if (idx === nFree) break outer;
          }
      } else {
          const MAX_TRIALS = 2000000;
          for (let t = 0; t < MAX_TRIALS && solutions.length < wanted; t++) {
              const freeVals = Array.from({ length: nFree }, () => Math.floor(Math.random() * (maxPerVar + 1)));
              tryRecord(evaluate(freeVals));
              if (t % CHUNK === 0) {
                  if (onProgress) onProgress(t, MAX_TRIALS);
                  await new Promise(resolve => setTimeout(resolve, 0));
              }
          }
      }

      return { solutions, infeasible: solutions.length === 0 };
  }

  async function solve() {
      const selected = Array.from(document.querySelectorAll(".sc:checked")).map(i => i.value);
      const resultsDiv = document.getElementById("results");
      if (!selected.length) return alert("Select symptoms!");

      const maxIng = Math.max(1, parseInt(document.getElementById("maxIng").value) || 60);
      const limit = Math.max(1, parseInt(document.getElementById("limit").value) || 5);

      const genBtn = document.querySelector(".solve-btn");
      genBtn.disabled = true;

      const components = getComponents(selected);
      const perClusterWanted = Math.max(3, Math.min(limit, 6));

      const clusterResults = [];
      for (const comp of components) {
          resultsDiv.innerHTML = `Solving for <b>${comp.join(" + ")}</b>...`;
          const { solutions, infeasible } = await solveCluster(comp, maxIng, perClusterWanted, (done, cap) => {
              resultsDiv.innerHTML = `Solving for <b>${comp.join(" + ")}</b>... (${done.toLocaleString()} / ${cap.toLocaleString()} checked)`;
          });
          clusterResults.push({ symptoms: comp, solutions, infeasible });
      }

      genBtn.disabled = false;

      const failedClusters = clusterResults.filter(c => c.solutions.length === 0);
      if (failedClusters.length) {
          resultsDiv.innerHTML =
              `No exact match possible for: <b>${failedClusters.map(c => c.symptoms.join(" + ")).join(", ")}</b>. ` +
              `This symptom combination can't be hit exactly with the current ingredients within ${maxIng} ingredients ` +
              `(these symptoms only interact with each other's ingredient pool, so they must be solved as their own group). ` +
              `Try raising Max Ingredients, or double-check the target percentages are reachable at all.`;
          return;
      }

      const minTotal = clusterResults.reduce((sum, c) => sum + c.solutions[0].length, 0);
      if (minTotal > maxIng) {
          resultsDiv.innerHTML =
              `Each symptom cluster is individually solvable, but the cheapest combination needs ` +
              `<b>${minTotal} ingredients</b> total, more than your current Max Ingredients (${maxIng}). ` +
              `Raise Max Ingredients to at least ${minTotal} and try again.<br><br>` +
              clusterResults.map(c => `${c.symptoms.join(" + ")}: cheapest solution uses ${c.solutions[0].length} ingredients`).join("<br>");
          return;
      }

      const combined = [];
      const seenFull = new Set();
      let idx = clusterResults.map(() => 0);

      outer:
      while (combined.length < limit) {
          let advanced = false;
          for (let c = 0; c < clusterResults.length; c++) {
              if (idx[c] >= clusterResults[c].solutions.length) continue;

              const combo = [];
              for (let j = 0; j < clusterResults.length; j++) {
                  const pick = (j === c) ? idx[c] : Math.min(idx[j], clusterResults[j].solutions.length - 1);
                  combo.push(...clusterResults[j].solutions[pick]);
              }
              if (combo.length <= maxIng) {
                  const key = JSON.stringify(combo.slice().sort());
                  if (!seenFull.has(key)) {
                      seenFull.add(key);
                      combined.push(combo);
                      advanced = true;
                      if (combined.length >= limit) break outer;
                  }
              }
              idx[c]++;
          }
          if (!advanced) break;
      }

      render(combined, resultsDiv, selected, false, maxIng);
  }

  function render(solutions, container, selected, exhausted, maxIng) {
      container.innerHTML = "";

      if (!solutions.length) {
          container.innerHTML = exhausted
              ? `No exact match found within ${maxIng} ingredients. Try raising Max Ingredients, or the target combination may not be reachable at all with the current ingredient set.`
              : "No exact matches found.";
          return;
      }

      solutions.forEach(list => {
          const counts = {};
          list.forEach(x => counts[x] = (counts[x] || 0) + 1);
          const card = document.createElement("div");
          card.className = "card";
          const ings = Object.entries(counts).map(([n, c]) => `<div><b>${c}x</b> ${n}</div>`).join("");
          const stats = selected.map(s => {
              const sum = list.reduce((a, b) => a + (ingredientTable[b][s] || 0), 0);
              return `${s}: ${sum}%`;
          }).join(" &middot; ");
          card.innerHTML = `${ings}<div class="meta">${list.length} ingredients total &middot; ${stats}</div>`;
          container.appendChild(card);
      });
  }
</script>

</html>
